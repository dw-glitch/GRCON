<!doctype html>
<html class="grcon-cloud-pending" lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="../../">
  <meta content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:" http-equiv="Content-Security-Policy">
  <title>Validação do mascote oficial multiformato</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #eef3f6; }
    .topbar { display: flex; min-height: 180px; align-items: center; padding: 24px; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .grcon-brand-mark { width: 1px; height: 1px; overflow: hidden; opacity: 0; }
    .grcon-brand-mascot { width: 160px !important; height: 160px !important; }
    #advanced-panel { margin: 20px; padding: 12px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="grcon-brand-mark" aria-hidden="true"></span>
      <strong>Mascote oficial GRCON</strong>
    </div>
  </header>
  <section id="advanced-panel" aria-label="Configurações avançadas"></section>
  <script defer src="grcon_mascot_header.js"></script>
  <script defer src="grcon_mascot_asset_fix.js"></script>
  <script defer src="grcon_mascot_greeting_core.js"></script>
  <script defer data-grcon-mascot-controller="video" src="grcon_mascot_controller.js"></script>
</body>
</html>
