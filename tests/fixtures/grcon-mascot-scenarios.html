<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="../../">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:" http-equiv="Content-Security-Policy">
  <title>Validação dos cenários contextuais do mascote</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#eef3f6;color:#183247;font-family:Arial,sans-serif}.topbar{display:flex;align-items:center;min-height:130px;padding:18px;background:#fff;border-bottom:1px solid #d8e1e7}.brand{display:flex;align-items:center;gap:14px}.grcon-brand-mark{width:1px;height:1px;overflow:hidden;opacity:0}.grcon-brand-mascot{width:100px!important;height:100px!important}main.workspace{width:min(1180px,calc(100vw - 32px));margin:20px auto;display:grid;gap:18px}.module-view,.posting-conference-module,.egrdt-teams-ready{padding:16px;border:1px solid #d8e1e7;border-radius:14px;background:#fff}.control-panel,.spw-base-grid,.spw-system-grid,.pc-hero,.pc-kpis,.egrdt-teams-ready-list{min-height:72px;padding:12px;border-radius:10px;background:#f6f9fb}.spw-base-grid{margin-top:10px}.spw-system-grid{margin-top:10px}.pc-kpis{margin-top:10px}.results-section{min-height:100px;padding:12px;background:#f8fafc}.egrdt-teams-ready{display:block}.egrdt-teams-dialog{width:min(900px,calc(100vw - 32px));border:0;border-radius:14px}.egrdt-teams-dialog form{padding:16px;background:#fff}.egrdt-teams-folder-check{display:block;padding:12px;background:#f8fafc}button{padding:8px 12px}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="grcon-brand-mark" aria-hidden="true"></span><strong>Mascote oficial GRCON</strong></div></header>
  <main class="workspace">
    <section id="grdt-module" class="module-view"><h2>Triagem</h2><div class="control-panel">Controles de análise</div><section id="results-section" class="results-section">Resultados</section><section id="egrdt-teams-ready" class="egrdt-teams-ready"><header><strong>PRÓXIMA ETAPA — eGRDT pronta para avisar no Teams</strong></header><div id="egrdt-teams-ready-list" class="egrdt-teams-ready-list">CTA Avisar no Teams</div></section></section>
    <section id="sigem-pw-dashboard-module" class="module-view"><h2>SIGEM × PW</h2><div id="spw-progress">Processando base…</div><section class="spw-base-grid">Importação de bases</section><section id="spw-system-grid" class="spw-system-grid">Resultados SIGEM × PW</section></section>
    <section id="posting-conference-module" class="posting-conference-module"><h2>Conferência de Postagem</h2><section class="pc-hero">Conferência</section><section class="pc-kpis">Indicadores</section></section>
  </main>
  <dialog id="egrdt-teams-dialog" class="egrdt-teams-dialog"><form method="dialog"><header><h2>Confirmar aviso da eGRDT</h2></header><div id="egrdt-teams-dialog-body">Prévia Teams</div><label class="egrdt-teams-folder-check">Confirmado</label><footer><button type="button">Enviar ao grupo</button></footer></form></dialog>
  <script defer src="grcon_mascot_header.js"></script>
  <script defer src="grcon_mascot_asset_fix.js"></script>
  <script defer src="grcon_mascot_greeting_core.js"></script>
  <script defer data-grcon-mascot-controller="video" src="grcon_mascot_controller.js"></script>
  <script defer data-grcon-mascot-runner="video" src="grcon_mascot_runner.js"></script>
  <script defer data-grcon-mascot-scenarios="true" src="grcon_mascot_scenarios.js"></script>
</body>
</html>
