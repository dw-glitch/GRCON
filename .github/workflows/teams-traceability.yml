name: Teams — Rastreabilidade
on:
  pull_request:
    paths:
      - '**/*teams*'
      - 'cloudflare/**'
      - 'history_report*'
      - 'posting_conference*'
      - 'requests_report.js'
      - 'src/react/historico-egrdt/**'
      - 'src/react/consultas/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: node tests/egrdt_teams_traceability.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validar-teams-trace-browser.cjs
