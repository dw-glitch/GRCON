name: Consultas branch gate

on:
  push:
    branches:
      - fix/consultas-react-parity-93
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consultas-branch-gate
  cancel-in-progress: true

jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consultas-react-parity-93

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerar lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalação reproduzível
        run: npm ci --ignore-scripts

      - name: Validação completa
        run: npm run verify

      - name: Persistir lockfile validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile já estava atualizado."
          else
            git commit -m "chore: atualizar lockfile da migração React"
            git push origin HEAD:fix/consultas-react-parity-93
          fi
