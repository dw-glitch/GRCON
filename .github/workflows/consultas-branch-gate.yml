name: Consultas branch gate

on:
  push:
    branches:
      - fix/consultas-react-parity-93
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consultas-branch-gate
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalação reproduzível
        run: npm ci --ignore-scripts

      - name: Validação completa
        run: npm run verify
