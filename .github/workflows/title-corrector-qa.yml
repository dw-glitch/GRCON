name: Corretor de títulos — regressão documental
on:
  pull_request:
    paths:
      - 'workers/title-corrector*'
      - 'src/react/title-corrector/**'
      - 'vendor/recon/scon_*'
      - 'tests/title_corrector*'
      - '.github/workflows/title-corrector-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  titulos:
    name: Analisar, preservar e exportar LD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/title_corrector_integration.cjs
      - run: node tests/title_corrector_worker.cjs
      - run: node tests/title_ai_security.mjs
