name: Corretor de títulos — regressão documental
# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  titulos:
    name: Analisar, preservar e exportar LD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/title_corrector_integration.cjs
      - run: node tests/title_corrector_worker.cjs
      - run: node tests/title_ai_security.mjs
