name: QA — Repostagem de GRDT

on:
  pull_request:
    paths:
      - "app.js"
      - "app-ui.js"
      - "emission.js"
      - "allocation_registry_core.js"
      - "allocation_registry_app.js"
      - "document_allocation_context.js"
      - "supabase/migrations/*shared_allocation_registry.sql"
      - "tests/allocation_registry*.cjs"
      - "package.json"
      - "package-lock.json"
      - "history_classification.js"
      - "posting_flow.js"
      - "posting_batch_planner.js"
      - "posting-flow.css"
      - "scripts/validar-unified-posting-browser.cjs"
      - "history_core.js"
      - "grcon_cloud_app.js"
      - "tests/history_classification.cjs"
      - "tests/cloud_history_pagination.cjs"
      - "grdt_reissue_core.js"
      - "grdt_reissue_app.js"
      - "grdt-reissue.css"
      - "index.html"
      - "p1_ux.js"
      - "grcon_module_loader.js"
      - "src/react/historico-egrdt/**"
      - "tests/grdt_reissue.cjs"
      - "scripts/validar-grdt-reissue-browser.cjs"
      - ".github/workflows/grdt-reissue-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Repostagem + loteamento — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar regressões e build
        run: |
          npm run typecheck
          npm run build
          npm run check:syntax
          node tests/history_classification.cjs
          node tests/cloud_history_pagination.cjs
          node tests/allocation_registry.cjs
          node tests/allocation_registry_database.cjs
          node tests/grdt_reissue.cjs
          node tests/discipline.mjs

      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: QA real no Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-reissue.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-grdt-reissue-browser.cjs
          node scripts/validar-unified-posting-browser.cjs

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: grdt-reissue-browser
          path: |
            artifacts/grdt-reissue-browser/*.png
            artifacts/grdt-reissue-browser/metrics.json
            artifacts/unified-posting/*.png
            artifacts/unified-posting/metrics.json
          if-no-files-found: warn
