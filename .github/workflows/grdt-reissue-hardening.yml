name: QA — Repostagem de GRDT

# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Repostagem + loteamento — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar regressões e build
        run: |
          npm run typecheck
          npm run build
          npm run check:syntax
          node tests/history_classification.cjs
          node tests/cloud_history_pagination.cjs
          node tests/allocation_registry.cjs
          node tests/allocation_registry_database.cjs
          node tests/grdt_reissue.cjs
          node tests/discipline.mjs

      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: QA real no Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-reissue.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-grdt-reissue-browser.cjs
          node scripts/validar-unified-posting-browser.cjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grdt-reissue-browser
          path: |
            artifacts/grdt-reissue-browser/*.png
            artifacts/grdt-reissue-browser/metrics.json
            artifacts/unified-posting/*.png
            artifacts/unified-posting/metrics.json
          if-no-files-found: warn
