name: Atualizar nome do status SIGEM

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-sigem-status-label.yml

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar textos da Conferência
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('posting_conference_core.js'): {
                  '"Revisão divergente"': '"Aguardando retorno do SIGEM"',
              },
              Path('posting_conference_app.js'): {
                  '"Revisão divergente"': '"Aguardando retorno do SIGEM"',
                  '"Revisão diferente"': '"Aguardando retorno do SIGEM"',
              },
          }

          changed = []
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Texto esperado não encontrado em {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('Nenhuma alteração foi aplicada.')
          print('Arquivos alterados:', ', '.join(changed))
          PY

      - name: Validar conferência
        run: node tests/posting_conference.cjs

      - name: Publicar alteração na main e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-sigem-status-label.yml
          git add posting_conference_core.js posting_conference_app.js
          git commit -m "Ajusta status para Aguardando retorno do SIGEM"
          git push origin main
