name: QA — Conversor PDF para DOCX

# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Dependências
        run: npm ci --ignore-scripts
      - name: Instalar ambiente de teste Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preparar leitor PDF.js local
        run: node scripts/prepare-pdfjs-assets.mjs
      - name: Conversão real e navegação
        run: |
          node scripts/validar-docx-pdf-browser.cjs
          node tests/additional_tools_navigation.cjs
