name: Deploy temporário — senha owner Supabase

on:
  push:
    branches:
      - feature/owner-password-management
    paths:
      - "supabase/functions/owner-change-user-password/**"
      - ".github/workflows/deploy-owner-password-function-temp.yml"

permissions:
  contents: read

concurrency:
  group: deploy-owner-password-function-temp
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar owner-change-user-password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: kvyrttccwzdhasplfxnr
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar credencial de deploy
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::O secret SUPABASE_ACCESS_TOKEN não está cadastrado neste repositório."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar Edge Function
        run: supabase functions deploy owner-change-user-password --project-ref "$SUPABASE_PROJECT_ID"

      - name: Confirmar função publicada
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
