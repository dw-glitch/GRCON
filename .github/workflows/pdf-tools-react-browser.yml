name: FASE B — Combinar PDFs React UI

on:
  pull_request:
    paths:
      - "src/react/pdf-tools/**"
      - "src/react/core/ui/**"
      - "src/react/core/mount/**"
      - "pdf_merge_core.js"
      - "pdf_merge_engine.js"
      - "workers/pdf-merge.worker.js"
      - "pdf-merge.css"
      - "react-ui.css"
      - "requests-phase-b.css"
      - "analysis-history-phase-b.css"
      - "grcon_module_loader.js"
      - "index.html"
      - "sw.js"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/pdf_tools_react.cjs"
      - "scripts/validar-pdf-tools-browser.cjs"
      - "scripts/validar-consultas-browser.cjs"
      - "scripts/validar-historico-analises-browser.cjs"
      - "docs/phase-b-pdf-tools-parity.md"
      - ".github/workflows/pdf-tools-react-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: PDF Tools FASE B + regressões React
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências de forma reproduzível
        run: npm ci --ignore-scripts

      - name: Typecheck e build
        run: |
          npm run typecheck
          npm run build

      - name: Contratos estáticos da FASE B
        run: node tests/pdf_tools_react.cjs

      - name: Confirmar pdf-lib fora do bundle React
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const code = fs.readFileSync("react-dist/pdf-tools-app.js", "utf8");
          if (/PDFLib|pdf-lib\.min\.js/.test(code)) {
            throw new Error("pdf-lib não pode ser incorporado ao bundle React do PDF Tools.");
          }
          console.log("pdf-lib fora do bundle React: ok");
          NODE

      - name: Suíte completa e verificação do projeto
        run: |
          npm test
          npm run verify

      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar FASE B, merge real, ciclo de vida, PWA e regressões
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-pdf-tools.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-pdf-tools-browser.cjs
          node scripts/validar-historico-analises-browser.cjs
          node scripts/validar-consultas-browser.cjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase-b-pdf-tools-ui
          path: |
            artifacts/pdf-tools-browser/*.png
            artifacts/pdf-tools-browser/metrics.json
            artifacts/historico-analises-browser/*.png
            artifacts/historico-analises-browser/metrics.json
            artifacts/consultas-browser/*.png
            artifacts/consultas-browser/metrics.json
          if-no-files-found: error
