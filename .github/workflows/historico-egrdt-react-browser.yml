name: Histórico de eGRDTs — hardening React

on:
  pull_request:
    paths:
      - "src/react/historico-egrdt/**"
      - "history_core.js"
      - "history_report.js"
      - "egrdt_teams_notification_app.js"
      - "grcon_module_loader.js"
      - "retomar.js"
      - "grcon_reposting_app.js"
      - "vite.config.ts"
      - "sw.js"
      - "scripts/validar-historico-egrdt-browser.cjs"
      - ".github/workflows/historico-egrdt-react-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Histórico de eGRDTs Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Testes estruturais
        run: |
          node tests/historico_egrdt_react.cjs
          node tests/history_performance.cjs
          node tests/history_information.cjs
      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduzir e validar Histórico de eGRDTs
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-historico-egrdt.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-historico-egrdt-browser.cjs
