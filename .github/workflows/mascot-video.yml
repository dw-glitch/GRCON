name: Validação do mascote em vídeo

on:
  push:
    branches: [main]
    paths:
      - "assets/mascot/video/**"
      - "assets/mascot/poster/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "grcon_mascot_controller_v4.js"
      - "grcon_mascot_runner.js"
      - "grcon_mascot_scenarios.js"
      - "egrdt_teams_notification_app.js"
      - "sw.js"
      - "index.html"
      - "vercel.json"
      - "scripts/validar-mascote-video-browser.cjs"
      - "scripts/validar-mascote-contextual-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/fixtures/grcon-mascot-scenarios.html"
      - "tests/grcon_mascot_video.cjs"
      - "tests/grcon_mascot_scenarios.cjs"
      - ".github/workflows/mascot-video.yml"
  pull_request:
    paths:
      - "assets/mascot/video/**"
      - "assets/mascot/poster/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "grcon_mascot_controller_v4.js"
      - "grcon_mascot_runner.js"
      - "grcon_mascot_scenarios.js"
      - "egrdt_teams_notification_app.js"
      - "sw.js"
      - "index.html"
      - "vercel.json"
      - "scripts/validar-mascote-video-browser.cjs"
      - "scripts/validar-mascote-contextual-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/fixtures/grcon-mascot-scenarios.html"
      - "tests/grcon_mascot_video.cjs"
      - "tests/grcon_mascot_scenarios.cjs"
      - ".github/workflows/mascot-video.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-mascot:
    name: Vídeos, cenários, cache, eventos reais e fallback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/grcon_mascot_video.cjs && node tests/grcon_mascot_scenarios.cjs
      - name: Instalar navegador de validação
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Testar aceno, processamento, transparência visual e fallback
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-mascote-video-browser.cjs
          node scripts/validar-mascote-contextual-browser.cjs
      - name: Resolver e validar Vercel Preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMENTS_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          PREVIEW_URL=""
          VERCEL_QUOTA_BLOCKED=0

          fetch_comments() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$COMMENTS_URL"
          }

          validate_preview() {
            local candidate="$1"
            local js ready stem format asset result code type size expected
            js="$(curl -fsSL "$candidate/grcon_mascot_scenarios.js" || true)"
            printf '%s' "$js" | grep -q '20260918.5' || return 1

            ready=1
            for stem in \
              grcon-mascot-import-bases \
              grcon-mascot-long-processing \
              grcon-mascot-sleep \
              grcon-mascot-curious \
              grcon-mascot-grdt-stamp \
              grcon-mascot-teams-send \
              grcon-mascot-grdt-to-teams \
              grcon-mascot-paperwork \
              grcon-mascot-review-coffee
            do
              for format in webm mp4; do
                asset="$stem.$format"
                result="$(curl -fsSL -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$candidate/assets/mascot/video/$asset?v=20260918.5" || true)"
                code="$(printf '%s' "$result" | awk '{print $1}')"
                type="$(printf '%s' "$result" | awk '{print $2}')"
                size="$(printf '%s' "$result" | awk '{print $3}')"
                expected="video/$format"
                echo "$asset -> HTTP=$code MIME=$type bytes=$size"
                if [ "$code" != "200" ] || [[ "$type" != "$expected"* ]] || [ "${size:-0}" -le 70000 ]; then
                  ready=0
                  break 2
                fi
              done
            done
            [ "$ready" = "1" ]
          }

          for attempt in $(seq 1 18); do
            COMMENTS_JSON="$(fetch_comments)"
            if printf '%s' "$COMMENTS_JSON" | jq -er '.[] | select(.user.login=="vercel[bot]") | .body' | grep -q 'api-deployments-free-per-day'; then
              VERCEL_QUOTA_BLOCKED=1
            fi

            mapfile -t CANDIDATES < <(
              printf '%s' "$COMMENTS_JSON" \
                | jq -r '.[] | select(.user.login=="vercel[bot]") | .body' \
                | grep -oE 'https://[^ )]+\.vercel\.app' \
                | awk '!seen[$0]++' \
                | tac
            )

            for candidate in "${CANDIDATES[@]:-}"; do
              [ -n "$candidate" ] || continue
              if validate_preview "$candidate"; then
                PREVIEW_URL="$candidate"
                break 2
              fi
            done

            sleep 10
          done

          if [ -z "$PREVIEW_URL" ]; then
            if [ "$VERCEL_QUOTA_BLOCKED" = "1" ]; then
              echo "::error title=Vercel Preview indisponível::O limite diário de deployments da Vercel foi atingido (api-deployments-free-per-day). Os testes locais passaram, mas não há Preview atual para a validação remota."
            else
              echo "::error title=Vercel Preview indisponível::Nenhum Preview contendo a revisão 20260918.5 ficou pronto para validação."
            fi
            exit 1
          fi

          echo "GRCON_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview validada: $PREVIEW_URL"
      - name: Testar os 9 cenários na Vercel Preview
        if: github.event_name == 'pull_request'
        run: GRCON_PREVIEW_URL="$GRCON_PREVIEW_URL" node scripts/validar-mascote-contextual-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: grcon-mascot-video-validation
          path: |
            artifacts/mascot-video/*.png
            artifacts/mascot-contextual/*.png
          if-no-files-found: error
