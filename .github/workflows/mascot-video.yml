name: Validação do mascote em vídeo

on:
  push:
    branches: [main]
    paths:
      - "assets/mascot/video/**"
      - "assets/mascot/poster/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "grcon_mascot_controller_v4.js"
      - "grcon_mascot_runner.js"
      - "grcon_mascot_scenarios.js"
      - "egrdt_teams_notification_app.js"
      - "sw.js"
      - "index.html"
      - "vercel.json"
      - "scripts/validar-mascote-video-browser.cjs"
      - "scripts/validar-mascote-contextual-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/fixtures/grcon-mascot-scenarios.html"
      - "tests/grcon_mascot_video.cjs"
      - "tests/grcon_mascot_scenarios.cjs"
      - ".github/workflows/mascot-video.yml"
  pull_request:
    paths:
      - "assets/mascot/video/**"
      - "assets/mascot/poster/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "grcon_mascot_controller_v4.js"
      - "grcon_mascot_runner.js"
      - "grcon_mascot_scenarios.js"
      - "egrdt_teams_notification_app.js"
      - "sw.js"
      - "index.html"
      - "vercel.json"
      - "scripts/validar-mascote-video-browser.cjs"
      - "scripts/validar-mascote-contextual-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/fixtures/grcon-mascot-scenarios.html"
      - "tests/grcon_mascot_video.cjs"
      - "tests/grcon_mascot_scenarios.cjs"
      - ".github/workflows/mascot-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mascot:
    name: Vídeos, cenários, cache, eventos reais e fallback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/grcon_mascot_video.cjs && node tests/grcon_mascot_scenarios.cjs
      - name: Instalar navegador de validação
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Testar aceno, processamento, transparência visual e fallback
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-mascote-video-browser.cjs
          node scripts/validar-mascote-contextual-browser.cjs
      - name: Resolver e validar Vercel Preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMENTS_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          PREVIEW_URL=""
          for attempt in $(seq 1 36); do
            BODY="$(curl -fsSL "$COMMENTS_URL" | jq -r '.[] | select(.user.login=="vercel[bot]") | .body' | tail -n +1)"
            PREVIEW_URL="$(printf '%s\n' "$BODY" | grep -oE 'https://[^ )]+\.vercel\.app' | tail -1 || true)"
            if [ -n "$PREVIEW_URL" ]; then
              JS="$(curl -fsSL "$PREVIEW_URL/grcon_mascot_scenarios.js" || true)"
              if printf '%s' "$JS" | grep -q '20260918.3'; then
                READY=1
                for asset in                   grcon-mascot-import-bases.mp4                   grcon-mascot-long-processing.mp4                   grcon-mascot-sleep.mp4                   grcon-mascot-curious.mp4                   grcon-mascot-grdt-stamp.mp4                   grcon-mascot-teams-send.mp4                   grcon-mascot-grdt-to-teams.mp4                   grcon-mascot-paperwork.mp4                   grcon-mascot-review-coffee.mp4
                do
                  RESULT="$(curl -fsSL -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$PREVIEW_URL/assets/mascot/video/$asset?v=20260918.3" || true)"
                  CODE="$(printf '%s' "$RESULT" | awk '{print $1}')"
                  TYPE="$(printf '%s' "$RESULT" | awk '{print $2}')"
                  SIZE="$(printf '%s' "$RESULT" | awk '{print $3}')"
                  echo "$asset -> HTTP=$CODE MIME=$TYPE bytes=$SIZE"
                  if [ "$CODE" != "200" ] || [[ "$TYPE" != video/mp4* ]] || [ "${SIZE:-0}" -le 70000 ]; then READY=0; break; fi
                done
                if [ "$READY" = "1" ]; then break; fi
              fi
            fi
            PREVIEW_URL=""
            sleep 5
          done
          if [ -z "$PREVIEW_URL" ]; then
            echo "Preview Vercel atual não ficou pronta para validação." >&2
            exit 1
          fi
          echo "GRCON_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview validada: $PREVIEW_URL"
      - name: Testar os 9 cenários na Vercel Preview
        if: github.event_name == 'pull_request'
        run: GRCON_PREVIEW_URL="$GRCON_PREVIEW_URL" node scripts/validar-mascote-contextual-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: grcon-mascot-video-validation
          path: |
            artifacts/mascot-video/*.png
            artifacts/mascot-contextual/*.png
          if-no-files-found: error
