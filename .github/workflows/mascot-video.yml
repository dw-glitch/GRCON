name: Validação do mascote em vídeo

on:
  push:
    branches: [main]
    paths:
      - "assets/mascot/video/**"
      - "assets/mascot/compat/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "grcon_mascot_controller_v5.js"
      - "grcon_mascot_compat_media.js"
      - "grcon_service_worker.js"
      - "sw-v6.js"
      - "vercel.json"
      - "scripts/validar-mascote-video-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/grcon_mascot_video.cjs"
      - ".github/workflows/mascot-video.yml"
  pull_request:
    paths:
      - "assets/mascot/video/**"
      - "assets/mascot/compat/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "grcon_mascot_controller_v5.js"
      - "grcon_mascot_compat_media.js"
      - "grcon_service_worker.js"
      - "sw-v6.js"
      - "vercel.json"
      - "scripts/validar-mascote-video-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/grcon_mascot_video.cjs"
      - ".github/workflows/mascot-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mascot:
    name: WebM, H.264, PNG, acessibilidade e migração
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar assets, player e Service Worker
        run: node tests/grcon_mascot_video.cjs
      - name: Instalar navegador de validação
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Testar fallback real no Chromium/Edge engine
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-mascote-video-browser.cjs
