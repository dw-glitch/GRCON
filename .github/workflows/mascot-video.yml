name: Validação do mascote em vídeo

on:
  push:
    branches: [main]
    paths:
      - "assets/mascot/video/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "scripts/validar-mascote-video-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/grcon_mascot_video.cjs"
      - ".github/workflows/mascot-video.yml"
  pull_request:
    paths:
      - "assets/mascot/video/**"
      - "grcon-mascot-sprite.png"
      - "grcon_mascot_controller.js"
      - "scripts/validar-mascote-video-browser.cjs"
      - "tests/fixtures/grcon-mascot-video.html"
      - "tests/grcon_mascot_video.cjs"
      - ".github/workflows/mascot-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mascot:
    name: Vídeos, eventos reais e fallback PNG
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/grcon_mascot_video.cjs
      - name: Instalar navegador de validação
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Testar aceno, processamento, transparência visual e fallback
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-mascote-video-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: grcon-mascot-video-validation
          path: artifacts/mascot-video/*.png
          if-no-files-found: error
