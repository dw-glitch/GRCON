name: QA — Revisão do arquivo na GRDT
# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node tests/grdt_file_revision.cjs && node tests/grdt_document_identity.cjs
      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Revisão, seleção e geração — Worker e legado
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-file-revision.log" 2>&1 &
          REVISION_QA_SERVER=$!
          trap 'kill "$REVISION_QA_SERVER"' EXIT
          node scripts/validar-grdt-file-revision-browser.cjs
          node scripts/validar-grdt-identity-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grdt-file-revision-browser
          path: |
            artifacts/grdt-file-revision/*.png
            artifacts/grdt-identity/*.png
          if-no-files-found: warn
