# Read-only production diagnosis authorized by the repository owner.
name: Diagnosticar envio Teams
on:
  push:
    branches: [fix/teams-flow-send-20261016]
    paths: [.github/workflows/diagnose-teams-flow.yml, scripts/diagnose-teams-flow.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Consultar somente metadados da execução com falha
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-teams-flow.mjs
