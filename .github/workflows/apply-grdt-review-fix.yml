name: Aplicar correção GRDT Revisar e Em Workflow

on:
  push:
    branches:
      - fix/grdt-review-workflow

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grdt-review-workflow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Aplicar correções com validação de contexto
        run: python scripts/apply_grdt_review_fix.py

      - name: Instalar metadados do projeto
        run: npm ci --ignore-scripts

      - name: Validar correção específica
        run: node tests/grdt_review_workflow.cjs

      - name: Executar validação completa do GRCON
        run: npm run verify

      - name: Gravar correção validada
        run: |
          rm .github/workflows/apply-grdt-review-fix.yml scripts/apply_grdt_review_fix.py
          git config user.name "grcon-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: permitir revisão manual na GRDT e normalizar Em Workflow"
          git push origin HEAD:fix/grdt-review-workflow
