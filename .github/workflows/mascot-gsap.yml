name: Validação do mascote PNG + GSAP

on:
  push:
    branches: [main]
    paths:
      - "assets/mascot/layers/**"
      - "grcon_mascot_controller.js"
      - "vendor/gsap/**"
      - "scripts/validar-mascote-gsap-browser.cjs"
      - "tests/fixtures/grcon-mascot-gsap.html"
      - ".github/workflows/mascot-gsap.yml"
  pull_request:
    paths:
      - "assets/mascot/layers/**"
      - "grcon_mascot_controller.js"
      - "vendor/gsap/**"
      - "scripts/validar-mascote-gsap-browser.cjs"
      - "tests/fixtures/grcon-mascot-gsap.html"
      - ".github/workflows/mascot-gsap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mascot:
    name: Identidade, lifecycle e fallback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/grcon_mascot_gsap.cjs
      - name: Instalar navegador de validação
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Testar idle, hover, busca LD, success e fallback
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-mascote-gsap-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: grcon-mascot-gsap-validation
          path: artifacts/mascot-gsap/*.png
          if-no-files-found: error
