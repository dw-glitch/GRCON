name: SIGEM Turso — diagnóstico seguro de produção

# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigem-readonly-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspecionar copia Turso em R2 e Cloudflare sem gravar
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'dw-glitch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar escopo e sigilo dos diagnosticos
        run: node tests/sigem_workflow_diagnosis.cjs
      - name: Ler progresso dos Workflows sem credenciais no log
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GRCON_RECOVERY_WORKSPACE: ${{ vars.GRCON_RECOVERY_WORKSPACE || 'cfb8e3a0-63de-4ae8-831d-7169da8015be' }}
        run: node scripts/diagnose-sigem-workflow.mjs
