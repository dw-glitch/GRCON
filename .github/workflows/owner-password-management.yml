name: QA — senha administrativa

# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grcon-owner-password-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Master/owner/admin/operator — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Testes de segurança
        run: node tests/owner_password_management.cjs
      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: QA da administração de senhas
        run: node scripts/validar-owner-password-browser.cjs
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owner-password-management
          path: artifacts/master-owner/*
          if-no-files-found: warn
