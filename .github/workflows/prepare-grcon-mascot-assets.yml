name: Preparar assets Higgsfield do mascote

on:
  push:
    branches:
      - "feat/grcon-mascot-runtime-higgsfield"
    paths:
      - ".github/workflows/prepare-grcon-mascot-assets.yml"

permissions:
  contents: write

jobs:
  prepare-assets:
    name: Baixar, recortar e versionar seis estados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IDLE_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260924_121054_2eaab221-011e-4d08-bb30-df8b8f0f4eb0.mp4
      HELLO_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260924_121053_c10f3f30-cb91-4ceb-a7d9-3e443efb6108.mp4
      ANALYZING_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260924_121054_c5cee622-84a8-40cf-858b-5060476d977e.mp4
      WARNING_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260924_121053_5e34f23c-8e8e-4485-8e12-285c4246957e.mp4
      SUCCESS_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260924_121056_4c337668-0cec-413a-a1d1-aeac9e5822c5.mp4
      RUN_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260924_121053_c7291bc5-1af8-4e96-956b-08c75a342a42.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/grcon-mascot-runtime-higgsfield"
          fetch-depth: 0

      - name: Instalar e confirmar FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Baixar fontes Higgsfield
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grcon-mascot-source" assets/mascot/video
          curl --fail --location --retry 4 --retry-all-errors "$IDLE_URL" -o "$RUNNER_TEMP/grcon-mascot-source/idle.mp4"
          curl --fail --location --retry 4 --retry-all-errors "$HELLO_URL" -o "$RUNNER_TEMP/grcon-mascot-source/hello.mp4"
          curl --fail --location --retry 4 --retry-all-errors "$ANALYZING_URL" -o "$RUNNER_TEMP/grcon-mascot-source/analyzing.mp4"
          curl --fail --location --retry 4 --retry-all-errors "$WARNING_URL" -o "$RUNNER_TEMP/grcon-mascot-source/warning.mp4"
          curl --fail --location --retry 4 --retry-all-errors "$SUCCESS_URL" -o "$RUNNER_TEMP/grcon-mascot-source/success.mp4"
          curl --fail --location --retry 4 --retry-all-errors "$RUN_URL" -o "$RUNNER_TEMP/grcon-mascot-source/run.mp4"

      - name: Gerar WebM VP9 com alpha
        shell: bash
        run: |
          set -euo pipefail
          convert_one() {
            local name="$1"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$RUNNER_TEMP/grcon-mascot-source/$name.mp4" \
              -an \
              -vf "chromakey=0x00FF00:0.20:0.08,despill=type=green" \
              -c:v libvpx-vp9 -pix_fmt yuva420p -auto-alt-ref 0 \
              -crf 31 -b:v 0 -row-mt 1 -deadline good -cpu-used 2 \
              "assets/mascot/video/grcon-mascot-$name-alpha.webm"
          }
          convert_one idle
          convert_one hello
          convert_one analyzing
          convert_one warning
          convert_one success
          convert_one run

      - name: Validar mídia e transparência
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/mascot/video/grcon-mascot-{idle,hello,analyzing,warning,success,run}-alpha.webm; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,pix_fmt:stream_tags=alpha_mode \
              -of default=nw=1 "$f"
            alpha="$(ffprobe -v error -select_streams v:0 -show_entries stream_tags=alpha_mode -of default=nw=1:nk=1 "$f" || true)"
            test "$alpha" = "1"
          done
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 assets/mascot/video/grcon-mascot-idle-alpha.webm)" = "960"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 assets/mascot/video/grcon-mascot-idle-alpha.webm)" = "960"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 assets/mascot/video/grcon-mascot-run-alpha.webm)" = "1280"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 assets/mascot/video/grcon-mascot-run-alpha.webm)" = "720"
          du -h assets/mascot/video/grcon-mascot-*-alpha.webm

      - name: Registrar procedência
        shell: bash
        run: |
          cat > assets/mascot/video/higgsfield-source.json <<'JSON'
          {
            "assetRevision": "20260924.1",
            "officialElement": {
              "name": "grcon-mascot",
              "id": "5d684379-9c43-47db-913a-6af9d779e8b2"
            },
            "format": "WebM VP9 with alpha, silent",
            "preparedAt": "2026-09-24",
            "jobs": {
              "idle": "2eaab221-011e-4d08-bb30-df8b8f0f4eb0",
              "hello": "c10f3f30-cb91-4ceb-a7d9-3e443efb6108",
              "analyzing": "c5cee622-84a8-40cf-858b-5060476d977e",
              "warning": "5e34f23c-8e8e-4485-8e12-285c4246957e",
              "success": "4c337668-0cec-413a-a1d1-aeac9e5822c5",
              "run": "c7291bc5-1af8-4e96-956b-08c75a342a42"
            }
          }
          JSON

      - name: Commitar assets versionados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mascot/video/grcon-mascot-idle-alpha.webm \
                  assets/mascot/video/grcon-mascot-hello-alpha.webm \
                  assets/mascot/video/grcon-mascot-analyzing-alpha.webm \
                  assets/mascot/video/grcon-mascot-warning-alpha.webm \
                  assets/mascot/video/grcon-mascot-success-alpha.webm \
                  assets/mascot/video/grcon-mascot-run-alpha.webm \
                  assets/mascot/video/higgsfield-source.json
          if git diff --cached --quiet; then
            echo "Assets já estão atualizados."
            exit 0
          fi
          git commit -m "chore(mascot): version Higgsfield alpha assets"
          git push origin "HEAD:feat/grcon-mascot-runtime-higgsfield"
