name: Verificar cobertura final GRDT

on:
  push:
    branches:
      - fix/grdt-review-workflow

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grdt-review-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validar teste GRDT ampliado
        run: node tests/grdt_review_workflow.cjs
      - name: Validar pacote completo
        run: npm run verify
      - name: Remover verificador temporário
        run: |
          rm .github/workflows/verify-grdt-followup.yml
          git config user.name "grcon-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover verificador temporário da GRDT"
          git push origin HEAD:fix/grdt-review-workflow
