name: PDF Tools — baseline legado

on:
  push:
    branches:
      - "phase-a/pdf-tools-react"
    paths:
      - "scripts/medir-pdf-tools-baseline.cjs"
      - ".github/workflows/pdf-tools-baseline.yml"
  pull_request:
    paths:
      - "scripts/medir-pdf-tools-baseline.cjs"
      - ".github/workflows/pdf-tools-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Chromium baseline legado
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preservar medidor da branch
        run: cp scripts/medir-pdf-tools-baseline.cjs "$RUNNER_TEMP/medir-pdf-tools-baseline.cjs"
      - name: Voltar à baseline legada
        run: git checkout --detach ea2d432542f026a0c6833ce68d329c48cf05ab12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Medir UI legada
        run: |
          mkdir -p artifacts/pdf-tools-baseline
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-pdf-baseline.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          NODE_PATH="$PWD/node_modules" node "$RUNNER_TEMP/medir-pdf-tools-baseline.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-tools-baseline
          path: artifacts/pdf-tools-baseline/metrics.json
          if-no-files-found: error
