name: Verificar nova URL Cloudflare
on:
  push:
    branches: [infra/cloudflare-workers-independent-deploy]
    paths: [.github/workflows/inspect-cloudflare-subdomain.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar aplicativo e metadados
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://grcon-cloudflare.grcon-qualidade.workers.dev';
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const home = await fetch(base);
              const html = await home.text();
              const meta = await fetch(base + '/deployment-meta.json');
              const json = await meta.json();
              console.log(JSON.stringify({ attempt, home: home.status, title: html.includes('GRCON'), metadata: meta.status, provider: json.provider, commit: json.commit }));
              if (home.ok && html.includes('GRCON') && meta.ok && json.provider === 'cloudflare') process.exit(0);
            } catch (error) {
              console.log(JSON.stringify({ attempt, error: String(error.cause?.code || error.message) }));
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          process.exit(1);
          NODE
