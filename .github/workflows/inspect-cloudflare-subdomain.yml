name: Conferir rota Cloudflare
on:
  push:
    branches: [infra/cloudflare-workers-independent-deploy]
    paths: [.github/workflows/inspect-cloudflare-subdomain.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir rota workers.dev do GRCON
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const account = await (await fetch(base + '/subdomain', { headers })).json();
          const response = await fetch(base + '/scripts/grcon-cloudflare/subdomain', { headers });
          const script = await response.json();
          console.log('Conta:', account.result?.subdomain);
          console.log('Worker route:', JSON.stringify({ status: response.status, enabled: script.result?.enabled, previews_enabled: script.result?.previews_enabled, errors: script.errors }));
          if (!account.success || !script.success) process.exit(1);
          NODE
