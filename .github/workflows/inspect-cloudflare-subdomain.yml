name: Inspecionar subdominio Cloudflare
on:
  push:
    branches: [infra/cloudflare-workers-independent-deploy]
    paths: [.github/workflows/inspect-cloudflare-subdomain.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar subdominio e Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers`;
          async function get(path) {
            const response = await fetch(base + path, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
            const data = await response.json();
            if (!response.ok || !data.success) {
              console.log(JSON.stringify({ path, status: response.status, errors: data.errors }));
              process.exitCode = 1;
              return;
            }
            return data;
          }
          const subdomain = await get('/subdomain');
          const scripts = await get('/scripts');
          if (subdomain) console.log('Subdominio da conta:', subdomain.result?.subdomain);
          if (scripts) console.log('Workers na conta:', JSON.stringify((scripts.result || []).map(({ id }) => id)));
          NODE
