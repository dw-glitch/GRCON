name: Atualizar subdominio Cloudflare
on:
  push:
    branches: [infra/cloudflare-workers-independent-deploy]
    paths: [.github/workflows/inspect-cloudflare-subdomain.yml]
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar e confirmar subdominio da conta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          async function call(method, body) {
            const response = await fetch(url, { method, headers, ...(body ? { body: JSON.stringify(body) } : {}) });
            const data = await response.json();
            return { ok: response.ok && data.success, status: response.status, data };
          }
          const previous = await call('GET');
          if (!previous.ok || previous.data.result?.subdomain !== 'soudebararaka') {
            console.log('Subdominio inesperado; nenhuma alteracao realizada.', previous.status, previous.data.errors);
            process.exit(1);
          }
          const removed = await call('DELETE');
          if (!removed.ok) {
            console.log('Falha ao remover subdominio antigo:', removed.status, removed.data.errors);
            process.exit(1);
          }
          const updated = await call('PUT', { subdomain: 'grcon-qualidade' });
          if (!updated.ok) {
            console.log('Falha ao definir novo subdominio:', updated.status, updated.data.errors);
            const restored = await call('PUT', { subdomain: 'soudebararaka' });
            console.log('Restauracao do antigo:', restored.ok ? 'confirmada' : JSON.stringify({ status: restored.status, errors: restored.data.errors }));
            process.exit(1);
          }
          const check = await call('GET');
          if (!check.ok || check.data.result?.subdomain !== 'grcon-qualidade') {
            console.log('Falha na verificacao:', check.status, check.data.errors, check.data.result?.subdomain);
            process.exit(1);
          }
          console.log('Novo subdominio confirmado:', check.data.result.subdomain);
          NODE
