name: Atualizar subdominio Cloudflare
on:
  push:
    branches: [infra/cloudflare-workers-independent-deploy]
    paths: [.github/workflows/inspect-cloudflare-subdomain.yml]
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Alterar e confirmar subdominio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const response = await fetch(url, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ subdomain: 'grcon-qualidade' }) });
          const data = await response.json();
          if (!response.ok || !data.success) {
            console.log(JSON.stringify({ status: response.status, errors: data.errors }));
            process.exit(1);
          }
          const check = await fetch(url, { headers });
          const current = await check.json();
          if (!check.ok || !current.success || current.result?.subdomain !== 'grcon-qualidade') {
            console.log(JSON.stringify({ status: check.status, errors: current.errors, subdomain: current.result?.subdomain }));
            process.exit(1);
          }
          console.log('Subdominio confirmado:', current.result.subdomain);
          NODE
