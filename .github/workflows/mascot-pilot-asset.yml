name: Materializar piloto do mascote

on:
  push:
    branches:
      - fix/mascot-contextual-pilot
    paths:
      - ".github/workflows/mascot-pilot-asset.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Gerar WebM VP9 com alpha a partir do piloto Higgsfield
        run: |
          set -euo pipefail
          mkdir -p assets/mascot/video
          curl -L --fail --retry 3             -o "$RUNNER_TEMP/grcon-mascot-success-pilot.mp4"             "https://d8j0ntlcm91z4.cloudfront.net/user_3JPlmNBUEodLWC5zqz9TRYPqweG/hf_20260921_110042_8a9472bd-6b1c-4648-a0a9-f750bcd71df6.mp4"
          ffmpeg -hide_banner -loglevel error             -i "$RUNNER_TEMP/grcon-mascot-success-pilot.mp4"             -vf "chromakey=0xFA34BE:0.22:0.06,crop=580:610:700:110,format=yuva420p"             -an -c:v libvpx-vp9 -pix_fmt yuva420p -auto-alt-ref 0             -crf 34 -b:v 0 -deadline good -cpu-used 2             assets/mascot/video/grcon-mascot-success-pilot-alpha.webm -y
          SIZE="$(stat -c%s assets/mascot/video/grcon-mascot-success-pilot-alpha.webm)"
          test "$SIZE" -gt 300000
          ffprobe -v error -show_entries stream=codec_name,width,height:stream_tags=alpha_mode             -of default=noprint_wrappers=1 assets/mascot/video/grcon-mascot-success-pilot-alpha.webm
      - name: Commitar asset gerado na branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mascot/video/grcon-mascot-success-pilot-alpha.webm
          git commit -m "chore(mascot): materialize Higgsfield success pilot asset"
          git push origin HEAD:fix/mascot-contextual-pilot
