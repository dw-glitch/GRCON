name: QA — Consulta Geral SIGEM compartilhada

# Gatilhos automaticos (pull_request/push/schedule) desativados para nao consumir minutos pagos do GitHub Actions.
# Execute manualmente em Actions > Run workflow quando precisar. A publicacao e feita pelo Cloudflare Workers Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-sigem:
    name: Consulta Geral compartilhada — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar regras centrais e build
        run: |
          node tests/shared_sigem_query.cjs
          npm run check:syntax
          npm run build

      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: QA real no Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-shared-sigem.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/validar-shared-sigem-browser.cjs
          node scripts/validar-sigem-general-query-browser.cjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-sigem-browser
          path: |
            artifacts/shared-sigem/*.png
            artifacts/shared-sigem/*.json
            artifacts/shared-sigem/*.xls
            artifacts/sigem-general-query/*.png
            artifacts/sigem-general-query/*.xlsx
            artifacts/sigem-general-query/*.csv
          if-no-files-found: warn
