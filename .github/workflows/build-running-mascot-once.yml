name: Finalizar migração temporária da corrida

on:
  push:
    branches: [codex/mascot-running-lane]
    paths:
      - .github/workflows/build-running-mascot-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mascot-running-lane
          fetch-depth: 0
      - name: Atualizar revisão e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('grcon_mascot_controller_v5.js')
          t = p.read_text(encoding='utf-8')
          pairs = [
            ('const ASSET_REVISION = "20260916.3";', 'const ASSET_REVISION = "20260916.4";'),
            ('const EXPECTED_SW_REVISION = "20260916.3-mascot-multiformat";', 'const EXPECTED_SW_REVISION = "20260916.4-mascot-running-lane";'),
            ('const EXPECTED_CACHE = "grcon-v5.40.11-mascot-multiformat-v2";', 'const EXPECTED_CACHE = "grcon-v5.40.11-mascot-running-v3";'),
          ]
          for old, new in pairs:
              if old in t:
                  t = t.replace(old, new, 1)
              elif new not in t:
                  raise SystemExit(f'constante não encontrada: {old}')
          p.write_text(t, encoding='utf-8')
          PY
          git rm .github/workflows/build-running-mascot-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalizar revisão da corrida do mascote [skip ci]"
          git push origin HEAD:codex/mascot-running-lane
