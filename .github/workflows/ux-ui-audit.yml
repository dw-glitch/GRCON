name: QA — UX/UI global

on:
  pull_request:
    paths:
      - "posting_conference_app.js"
      - "posting_conference_refinement.js"
      - "posting-conference.css"
      - "grcon_reposting_app.js"
      - "grcon-reposting.css"
      - "scripts/check-conference-layout.cjs"
      - "scripts/validar-ux-ui-global.cjs"
      - ".github/workflows/ux-ui-audit.yml"
      - "grcon-ui.css"
      - "grcon-final.css"
      - "grcon-responsive.css"
      - "design-system.css"
      - "legacy-compat.css"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grcon-ux-ui-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-ui:
    name: Conferência + navegação completa — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Typecheck, build, testes e verificação
        run: npm run verify
      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: QA geométrico da Conferência
        run: node scripts/check-conference-layout.cjs
      - name: QA navegacional UX/UI do GRCON
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/grcon-ux-ui-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/grcon-ux-ui-server.log"
              exit 1
            fi
            sleep 1
          done
          node scripts/validar-ux-ui-global.cjs
      - name: Publicar evidências UX/UI
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ux-ui-audit
          path: |
            artifacts/ux-ui-audit/*.png
            artifacts/ux-ui-audit/*.json
          if-no-files-found: warn
