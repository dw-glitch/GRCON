name: Validação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grcon-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Pacote, segurança e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências de forma reproduzível
        run: npm ci --ignore-scripts

      - name: Executar validação completa
        run: npm run verify

      - name: Medir referência sintética da conferência
        run: npm run benchmark:conference

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conference-benchmark
          path: artifacts/evolution/conference-benchmark.json
          if-no-files-found: warn
