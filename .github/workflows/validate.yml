name: Validação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grcon-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Pacote, segurança e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar metadados do projeto
        run: npm ci --ignore-scripts

      - name: Executar validação completa
        run: npm run verify
