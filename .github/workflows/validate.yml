name: Validação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grcon-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Pacote, segurança e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar metadados do projeto
        # `npm install` (não `npm ci`) porque `package-lock.json` ainda não
        # reflete react/react-dom/vite/typescript adicionados para a ilha
        # React de Consultas — precisa ser regenerado com `npm install` em
        # um ambiente com Node e recommitado; `npm ci` falharia até lá.
        run: npm install --ignore-scripts

      - name: Executar validação completa
        run: npm run verify
