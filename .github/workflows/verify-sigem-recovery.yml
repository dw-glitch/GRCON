name: SIGEM — Recuperação real de backup

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: UUID da área de trabalho
        required: true
        type: string
      contract:
        description: UUID do contrato
        required: true
        type: string
      snapshot:
        description: UUID da versão copiada
        required: true
        type: string
      manifest_hash:
        description: SHA-256 do manifesto conferido no Turso
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grcon-sigem-recovery-drill
  cancel-in-progress: false

jobs:
  recovery:
    name: Restaurar backup em SQLite e PostgreSQL isolados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Conferir projeção SQL e reversão isoladas
        run: node tests/sigem_compatibility_cache.cjs
      - name: Conferir recuperação sintética
        run: node tests/sigem_recovery_drill.cjs
      - name: Diagnosticar interrupções da cópia (somente leitura)
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GRCON_RECOVERY_WORKSPACE: ${{ inputs.workspace }}
        run: node scripts/diagnose-sigem-workflow.mjs
      - name: Recuperar e comparar a versão corporativa
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GRCON_RECOVERY_WORKSPACE: ${{ inputs.workspace }}
          GRCON_RECOVERY_CONTRACT: ${{ inputs.contract }}
          GRCON_RECOVERY_SNAPSHOT: ${{ inputs.snapshot }}
          GRCON_RECOVERY_MANIFEST_HASH: ${{ inputs.manifest_hash }}
          GRCON_RECOVERY_VERIFY_COMPATIBILITY: 'true'
        run: node scripts/verify-sigem-r2-recovery.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: sigem-recovery-summary
          path: artifacts/sigem-recovery/summary.json
          retention-days: 14
          if-no-files-found: error
